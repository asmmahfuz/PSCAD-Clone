[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pscad-clone-py"
version = "5.1.0"
description = "PSCAD CLONE EMTDC High-Performance Automation & Python Client SDK"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "PSCAD CLONE Engineering Team", email = "engineering@pscad-clone.io" }
]
keywords = ["pscad", "emtdc", "power-systems", "simulation", "emt", "fmi", "pmu", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "websockets>=10.0",
]
all = [
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "websockets>=10.0",
]

[project.urls]
Homepage = "https://github.com/pscad-clone/pscad-clone"
Documentation = "https://pscad-clone.io/docs"
