[package]
name = "pscad-modern"
version = "5.1.0"
description = "PSCAD Modern - High-Performance EMTDC Engineering CAD & Simulation Suite"
authors = ["PSCAD Modern Engineering Team"]
edition = "2021"

[lib]
name = "pscad_modern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [
    "tray-icon",
    "image-ico",
    "image-png"
] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-window-state = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
